<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>My Battle Lobby</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080a10;
  font-family:Arial,sans-serif;
}

#lobby{
  position:relative;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 50% 35%,#555b80,#202437 48%,#090b12);
}

#game3d{
  position:absolute;
  inset:0;
}

.top{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

.box{
  padding:10px 15px;
  border-radius:10px;
  background:rgba(10,10,18,.78);
  border:1px solid rgba(255,255,255,.12);
  color:white;
}

.name{
  color:#c77cff;
  font-weight:bold;
}

.title{
  position:absolute;
  top:82px;
  width:100%;
  text-align:center;
  color:white;
  font-size:25px;
  font-weight:bold;
  letter-spacing:3px;
  text-shadow:0 0 15px #8b35ff;
  z-index:10;
}

.menu{
  position:absolute;
  left:15px;
  bottom:20px;
  display:flex;
  gap:8px;
  z-index:10;
}

.menu button{
  padding:12px 14px;
  border:0;
  border-radius:10px;
  background:rgba(15,15,25,.88);
  color:white;
  font-weight:bold;
}

.play{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:15px 55px;
  border:0;
  border-radius:13px;
  background:#8b35ff;
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 20px rgba(139,53,255,.55);
  z-index:10;
}

.help{
  position:absolute;
  bottom:80px;
  width:100%;
  text-align:center;
  color:#ddd;
  font-size:13px;
  z-index:10;
}
</style>
</head>

<body>

<div id="lobby">

  <div id="game3d"></div>

  <div class="top">
    <div class="box">
      👤 <span class="name">PLAYER</span><br>
      Nivel 1
    </div>

    <div class="box">
      🪙 1,250 &nbsp; 💎 150
    </div>
  </div>

  <div class="title">
    MY BATTLE LOBBY
  </div>

  <div class="help">
    👆 Arrastra al personaje para girarlo
  </div>

  <div class="menu">
    <button>🎒 INVENTARIO</button>
    <button>👕 VESTUARIO</button>
    <button>🛒 TIENDA</button>
  </div>

  <button class="play" onclick="alert('Partida de prueba')">
    JUGAR
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const container = document.getElementById("game3d");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0,2.2,7);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);

container.appendChild(renderer.domElement);

/* Luces */

const ambient = new THREE.AmbientLight(0xffffff,1.7);
scene.add(ambient);

const light = new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(3,6,5);
scene.add(light);

/* Suelo */

const floorGeometry =
  new THREE.CircleGeometry(4,64);

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color:0x171a27,
    roughness:.8
  });

const floor =
  new THREE.Mesh(
    floorGeometry,
    floorMaterial
  );

floor.rotation.x=-Math.PI/2;
floor.position.y=-2;
scene.add(floor);

/* Personaje */

const hero = new THREE.Group();
hero.position.y=-1.7;
scene.add(hero);

/* Materiales */

const skin =
  new THREE.MeshStandardMaterial({
    color:0xd49a72
  });

const hair =
  new THREE.MeshStandardMaterial({
    color:0x27a83d,
    roughness:.65
  });

const clothes =
  new THREE.MeshStandardMaterial({
    color:0x252b42,
    roughness:.7
  });

const jacket =
  new THREE.MeshStandardMaterial({
    color:0x8b35ff,
    roughness:.55
  });

const dark =
  new THREE.MeshStandardMaterial({
    color:0x11131b
  });

const metal =
  new THREE.MeshStandardMaterial({
    color:0xbfc7d5,
    metalness:.8,
    roughness:.25
  });

/* Cabeza */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(.43,32,32),
    skin
  );

head.scale.set(.9,1.08,.9);
head.position.y=2.35;
hero.add(head);

/* Cabello */

const hairMesh =
  new THREE.Mesh(
    new THREE.SphereGeometry(.47,32,32),
    hair
  );

hairMesh.scale.set(1,0.62,1);
hairMesh.position.set(0,2.7,0);
hero.add(hairMesh);

/* Torso */

const torso =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(.52,.85,12,24),
    clothes
  );

torso.position.y=1.45;
hero.add(torso);

/* Chaqueta */

const coat =
  new THREE.Mesh(
    new THREE.BoxGeometry(1.12,1.2,.72),
    jacket
  );

coat.position.y=1.5;
coat.scale.set(1,.95,.9);
hero.add(coat);

/* Brazos */

function makeArm(x){
  const arm =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(.15,.85,8,16),
      clothes
    );

  arm.position.set(x,1.45,0);
  arm.rotation.z=x>0?-0.12:0.12;

  hero.add(arm);
}

makeArm(-.72);
makeArm(.72);

/* Piernas */

function makeLeg(x){
  const leg =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(.19,.95,8,16),
      dark
    );

  leg.position.set(x,.25,0);
  hero.add(leg);
}

makeLeg(-.28);
makeLeg(.28);

/* Botas */

function makeBoot(x){
  const boot =
    new THREE.Mesh(
      new THREE.BoxGeometry(.4,.25,.65),
      dark
    );

  boot.position.set(x,-.45,.08);
  hero.add(boot);
}

makeBoot(-.28);
makeBoot(.28);

/* Espada */

const sword = new THREE.Group();

const blade =
  new THREE.Mesh(
    new THREE.BoxGeometry(.12,1.8,.06),
    metal
  );

blade.position.y=.85;
sword.add(blade);

const handle =
  new THREE.Mesh(
    new THREE.CylinderGeometry(.07,.07,.55,12),
    dark
  );

handle.position.y=-.25;
sword.add(handle);

sword.position.set(.95,1.3,.1);
sword.rotation.z=-.15;

hero.add(sword);

/* Giro táctil */

let dragging=false;
let previousX=0;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{
    dragging=true;
    previousX=e.touches[0].clientX;
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchmove",
  e=>{
    if(!dragging)return;

    const x=e.touches[0].clientX;
    const movement=x-previousX;

    hero.rotation.y += movement*.012;

    previousX=x;
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchend",
  ()=>{
    dragging=false;
  }
);

/* También permite girar con mouse */

let mouseDown=false;
let oldMouseX=0;

renderer.domElement.addEventListener(
  "mousedown",
  e=>{
    mouseDown=true;
    oldMouseX=e.clientX;
  }
);

window.addEventListener(
  "mousemove",
  e=>{
    if(!mouseDown)return;

    hero.rotation.y +=
      (e.clientX-oldMouseX)*.012;

    oldMouseX=e.clientX;
  }
);

window.addEventListener(
  "mouseup",
  ()=>{
    mouseDown=false;
  }
);

/* Animación */

function animate(){
  requestAnimationFrame(animate);

  hero.position.y =
    -1.7 + Math.sin(Date.now()*.002)*.025;

  renderer.render(scene,camera);
}

animate();

/* Adaptación al teléfono */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect =
      window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);
</script>

</body>
</html>
