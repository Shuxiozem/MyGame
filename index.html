<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>My Battle Game</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#090b12;
}

.screen{
  position:absolute;
  inset:0;
}

.hidden{
  display:none;
}

/* LOBBY */

#lobby{
  background:
    radial-gradient(circle at 50% 35%,#555b80,#202437 50%,#090b12);
  color:white;
}

.logo{
  text-align:center;
  margin-top:70px;
  font-size:28px;
  font-weight:bold;
  letter-spacing:3px;
}

.play{
  position:absolute;
  bottom:45px;
  left:50%;
  transform:translateX(-50%);
  width:210px;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#8b35ff;
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 0 25px #8b35ff88;
}

.lobbyText{
  position:absolute;
  top:130px;
  width:100%;
  text-align:center;
  color:#ddd;
}

/* PARTIDA */

#match{
  background:
    linear-gradient(
      #52709a 0%,
      #8aa36e 48%,
      #536344 49%,
      #30382d 100%
    );
}

.map{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 80px,
      rgba(255,255,255,.025) 81px,
      transparent 82px
    );
}

/* Objetivo */

.target{
  position:absolute;
  width:65px;
  height:125px;
  right:23%;
  top:48%;
  transform:translateY(-50%);
}

.targetHead{
  width:43px;
  height:43px;
  margin:auto;
  border-radius:50%;
  background:#c98e69;
}

.targetBody{
  width:60px;
  height:75px;
  margin:auto;
  border-radius:18px;
  background:#c93636;
}

.targetHealth{
  width:80px;
  height:8px;
  margin:-140px auto 0;
  background:#222;
  border-radius:8px;
  overflow:hidden;
}

.targetHealthBar{
  width:100%;
  height:100%;
  background:#51d36a;
}

/* Personaje */

.player{
  position:absolute;
  left:27%;
  top:48%;
  transform:translate(-50%,-50%);
  width:70px;
  height:145px;
}

.playerHead{
  width:44px;
  height:44px;
  margin:auto;
  border-radius:50%;
  background:#c98e69;
}

.playerBody{
  width:62px;
  height:72px;
  margin:auto;
  border-radius:18px;
  background:#8b35ff;
}

.playerLegs{
  display:flex;
  justify-content:center;
  gap:8px;
}

.leg{
  width:20px;
  height:45px;
  background:#171923;
  border-radius:10px;
}

/* Controles */

.joystick{
  position:absolute;
  left:25px;
  bottom:35px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#ffffff18;
  border:2px solid #ffffff35;
  z-index:10;
}

.stick{
  position:absolute;
  left:35px;
  top:35px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#8b35ffcc;
}

.fire{
  position:absolute;
  right:25px;
  bottom:45px;
  width:95px;
  height:95px;
  border:0;
  border-radius:50%;
  background:#8b35ff;
  color:white;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 0 25px #8b35ff88;
}

.exit{
  position:absolute;
  top:20px;
  left:20px;
  padding:10px 15px;
  border:0;
  border-radius:10px;
  background:#111827dd;
  color:white;
}

.message{
  position:absolute;
  top:25px;
  width:100%;
  text-align:center;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- LOBBY -->

<div id="lobby" class="screen">

  <div class="logo">
    MY BATTLE LOBBY
  </div>

  <div class="lobbyText">
    Entrenamiento
  </div>

  <button class="play" onclick="startMatch()">
    JUGAR
  </button>

</div>


<!-- PARTIDA -->

<div id="match" class="screen hidden">

  <div class="map"></div>

  <button class="exit" onclick="backLobby()">
    ← SALIR
  </button>

  <div id="message" class="message">
    OBJETIVO DE ENTRENAMIENTO
  </div>

  <!-- PERSONAJE -->

  <div id="player" class="player">

    <div class="playerHead"></div>

    <div class="playerBody"></div>

    <div class="playerLegs">
      <div class="leg"></div>
      <div class="leg"></div>
    </div>

  </div>

  <!-- OBJETIVO -->

  <div class="target">

    <div class="targetHead"></div>

    <div class="targetBody"></div>

    <div class="targetHealth">
      <div id="targetHealthBar"
           class="targetHealthBar"></div>
    </div>

  </div>

  <!-- JOYSTICK -->

  <div id="joystick" class="joystick">
    <div id="stick" class="stick"></div>
  </div>

  <!-- DISPARO -->

  <button id="fire" class="fire">
    🔫<br>
    DISPARAR
  </button>

</div>


<script>

const lobby =
  document.getElementById("lobby");

const match =
  document.getElementById("match");

const player =
  document.getElementById("player");

const healthBar =
  document.getElementById("targetHealthBar");

const message =
  document.getElementById("message");


function startMatch(){

  lobby.classList.add("hidden");

  match.classList.remove("hidden");

}


function backLobby(){

  match.classList.add("hidden");

  lobby.classList.remove("hidden");

}


/* DISPARAR */

let health=100;

document
.getElementById("fire")
.addEventListener("click",()=>{

  if(health<=0) return;

  health-=10;

  healthBar.style.width =
    health+"%";

  message.textContent =
    "IMPACTO — "+health+" HP";

  if(health===0){

    message.textContent =
      "OBJETIVO COMPLETADO";

    setTimeout(()=>{

      health=100;

      healthBar.style.width =
        "100%";

      message.textContent =
        "OBJETIVO DE ENTRENAMIENTO";

    },1500);

  }

});


/* JOYSTICK */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let active=false;

joystick.addEventListener(
  "touchstart",
  ()=>{
    active=true;
  },
  {passive:true}
);

joystick.addEventListener(
  "touchmove",
  e=>{

    if(!active)return;

    const rect =
      joystick.getBoundingClientRect();

    let x =
      e.touches[0].clientX -
      rect.left -
      rect.width/2;

    let y =
      e.touches[0].clientY -
      rect.top -
      rect.height/2;

    const distance =
      Math.min(Math.hypot(x,y),35);

    const angle =
      Math.atan2(y,x);

    x =
      Math.cos(angle)*distance;

    y =
      Math.sin(angle)*distance;

    stick.style.transform =
      `translate(${x}px,${y}px)`;

    player.style.transform =
      `translate(
        calc(-50% + ${x}px),
        calc(-50% + ${y}px)
      )`;

  },
  {passive:true}
);

joystick.addEventListener(
  "touchend",
  ()=>{

    active=false;

    stick.style.transform =
      "translate(0,0)";

  }
);

</script>

</body>
</html>
